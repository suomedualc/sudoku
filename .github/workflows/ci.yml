name: CI

# 最小可用的回归护栏：跑测试 + 两个平台的编译。
#
# 为什么只做这些：这个项目此前**完全没有 CI**，149 项测试全靠人手跑 `gradlew jvmTest`，
# 改动一次 UI 却忘了跑测试的成本远高于维护这份 workflow。先立"能自动发现回归"的底线，
# 之后再按需加缓存、代码风格检查、打包等。
#
# 刻意**不做**的事：
# - 不跑 `android-smoke.ps1` / `smoke-e2e.ps1`：它们要真实窗口 / 模拟器 / 前台焦点，
#   在 CI 容器里既跑不起来也跑不稳（脚本自己也要求 `SetCursorPos` 之类的前台能力）。
# - 不打包 AAB / MSI：签名密钥不在 CI 里，且打包不是每次提交都需要。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新提交取消旧的运行：CI 只关心最新一次的结果
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 21：与 composeApp/build.gradle.kts 的 `jvmToolchain(21)` 对齐。
      # 注意字节码目标是 17（`jvmTarget = JVM_17`），但 Gradle 守护进程本身要 21。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android SDK 只用于 `compileDebugKotlinAndroid`（编译期校验），不打包。
      # 若哪天改成打包，需要另加签名配置。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 单元测试 + Compose UI 测试（jvmTest 覆盖 commonTest 与 jvmTest 两个源集）。
      # 这是本项目唯一能自动验证行为的入口，务必保持全绿。
      - name: Run tests
        run: ./gradlew :composeApp:jvmTest --stacktrace

      # Android 端的单元测试（`androidUnitTest` 源集）。
      # 只跑纯 JVM 可测的部分（如 `AndroidGameStore` 的原子写），不跑 instrumentation。
      - name: Run Android unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      # 两个平台的编译各跑一次：commonMain 改动很容易只在一个 target 上编译不过
      # （expect/actual 漏实现、平台 API 不兼容）。测试只覆盖 JVM，Android 靠这一步兜住。
      - name: Compile JVM
        run: ./gradlew :composeApp:compileKotlinJvm --stacktrace

      - name: Compile Android
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --stacktrace

      # 失败时把测试报告传上来，省得只看日志猜是哪条用例挂了
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            composeApp/build/reports/tests/jvmTest
            composeApp/build/test-results/jvmTest
            composeApp/build/reports/tests/testDebugUnitTest
            composeApp/build/test-results/testDebugUnitTest
          retention-days: 7
