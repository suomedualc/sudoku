org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# 工具链 JDK 21：由启动 Gradle 的 JAVA_HOME 满足（Gradle 会把运行中的 JVM 作为工具链候选），
# 因此仓库内**不写死本机路径**。若 JDK 21 不在 JAVA_HOME，可在用户级 ~/.gradle/gradle.properties 声明：
#   org.gradle.java.installations.paths=/path/to/jdk-21
# 另注：启动 Gradle 的 JAVA_HOME 必须是 JDK 17~24，实测 JDK 25 会让 Gradle 8.12 直接失败。

