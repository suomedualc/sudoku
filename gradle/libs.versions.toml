[versions]
compose-multiplatform = "1.11.1"
kotlin = "2.4.0"
agp = "8.10.1"
activity-compose = "1.10.1"
lifecycle-runtime = "2.8.7"

[libraries]
# 无第三方 UI 组件库：骨架、控件与提示全部自绘（详见 docs/02-设计规范.md §2）
# Android 端仅两组官方 androidx 依赖：Activity 装配（enableEdgeToEdge / setContent）与生命周期
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# AGP 8.9 最低要求 Gradle 8.11.1，本仓 wrapper 8.12 满足
androidApplication = { id = "com.android.application", version.ref = "agp" }
